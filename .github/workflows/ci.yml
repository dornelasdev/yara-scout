name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and rule validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Validate starter rules
        run: uv run --no-sync yara-scout validate rules/
