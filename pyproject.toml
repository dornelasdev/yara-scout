[project]
name = "yara-scout"
version = "0.1.0"
description = "Safe, structured file triage with YARA rules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "rich>=13,<15",
    "typer>=0.12,<1",
    "yara-python>=4.5,<5",
]

[project.scripts]
yara-scout = "yara_scout.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
